<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Myntra — Confidence Check MVP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:#282828;background:#f7f7f7}.top{height:72px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 5%;gap:28px;position:sticky;top:0;z-index:10}.logo{font-size:27px;font-weight:900;color:#ff3f6c;cursor:pointer}.nav button,.iconbtn{border:0;background:none;cursor:pointer;font-weight:700;font-size:13px}.search{flex:1;max-width:480px;background:#f5f5f6;border:1px solid #eee;border-radius:5px;padding:12px 16px}.actions{display:flex;gap:18px;align-items:center}.page{max-width:1200px;margin:auto;padding:28px 20px}.hero{background:#fff;border-radius:12px;padding:28px;margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:28px}.muted{color:#777}.cats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.cat{padding:10px 14px;border:1px solid #ddd;border-radius:22px;background:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #eee;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px #00000012}.pic{height:330px;background:#f3f3f3;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;cursor:pointer}.details{padding:14px}.brand{font-weight:800}.name{font-size:14px;margin:4px 0 10px}.price{font-weight:900}.tag{display:inline-block;margin-top:9px;background:#fff1f4;color:#d82f58;border-radius:4px;padding:5px 8px;font-size:11px;font-weight:800}.section-title{margin:28px 0 14px}.product{display:grid;grid-template-columns:48% 52%;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #eee}.bigpic{min-height:650px;background:#f4f4f4}.bigpic img{width:100%;height:100%;object-fit:cover}.info{padding:34px}.confidence{margin-top:22px;border:1px solid #e5e5e8;border-radius:12px;padding:18px}.score{display:flex;justify-content:space-between;align-items:center}.score b{font-size:30px}.meter{height:8px;background:#eee;border-radius:8px;margin:12px 0;overflow:hidden}.meter i{display:block;height:100%;width:82%;background:#31a36d}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#f5f5f7;border-radius:20px;padding:7px 10px;font-size:12px;font-weight:700}.fit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.fit button{padding:12px;border:1px solid #ddd;background:#fff;border-radius:8px;cursor:pointer;font-weight:700}.fit button.sel{border-color:#ff3f6c;background:#fff1f4;color:#d72c57}.cta{width:100%;padding:15px;border:0;border-radius:8px;background:#ff3f6c;color:#fff;font-weight:900;cursor:pointer;margin-top:18px}.secondary{background:#f0f0f2;color:#222}.evidence{margin-top:18px;border-top:1px solid #eee;padding-top:18px}.ev{padding:12px;background:#f7f7f8;border-radius:9px;margin:8px 0;font-size:13px}.bag{background:#fff;padding:28px;border-radius:12px}.empty{text-align:center;padding:70px}.back{border:0;background:none;font-weight:800;cursor:pointer;margin-bottom:16px}.hidden{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.product{grid-template-columns:1fr}.bigpic{min-height:420px}.top{gap:12px}.nav{display:none}}@media(max-width:560px){.grid{grid-template-columns:1fr}.actions span{display:none}}
</style></head>
<body>
<header class="top"><div class="logo" onclick="home()">myntra</div><nav><button onclick="category('Men')">MEN</button> <button onclick="category('Women')">WOMEN</button> <button onclick="category('Kids')">KIDS</button> <button onclick="category('Home')">HOME</button> <button onclick="category('Beauty')">BEAUTY</button></nav><input id="search" class="search" placeholder="Search products, brands and more" onkeydown="if(event.key==='Enter')doSearch()"><div class="actions"><button class="iconbtn" onclick="wishlist()">♡ <span>Wishlist</span></button><button class="iconbtn" onclick="bag()">🛍 <span>Bag</span></button></div></header>
<main id="app" class="page"></main>
<script>
const products=[
{id:1,cat:'Men',brand:'Roadster',name:'Navy Blue & Grey Regular Fit Checked Casual Shirt',price:'₹1,199',img:'https://assets.myntassets.com/assets/images/8889735/2019/4/1/ca936d22-0508-4c9a-8a75-da38b00916371554121346539-Roadster-Men-Navy-Blue--Grey-Regular-Fit-Checked-Casual-Shir-1.jpg',conf:82},
{id:2,cat:'Men',brand:'Levi’s',name:'Navy Blue 511 Slim Fit Stretchable Jeans',price:'₹2,499',img:'https://assets.myntassets.com/assets/images/18973942/2022/9/22/b13a96f9-7513-4b2f-b08a-87836a2ae2c31663827300029-Levis-Men-Navy-Blue-511-Slim-Fit-Mid-Rise-Clean-Look-Stretch-1.jpg',conf:88},
{id:3,cat:'Men',brand:'HRX by Hrithik Roshan',name:'Men Dynamic Running Shoe',price:'₹1,899',img:'https://assets.myntassets.com/assets/images/24516190/2023/11/9/42f6c4a1-80bb-4d48-9f2d-ecb82d1964801699532858427-HRX-by-Hrithik-Roshan-Men-Dynamic-Running-Shoe-6131699532858-12.jpg',conf:86},
{id:4,cat:'Women',brand:'Anouk',name:'Women Blue & Pink Floral A-Line Kurta',price:'₹899',img:'https://assets.myntassets.com/h_200,w_200,c_fill,g_auto/h_1440,q_100,w_1080/v1/assets/images/2472860/2018/4/16/11523871876212-Anouk-Women-Kurtas-4391523871875899-1.jpg',conf:84},
{id:5,cat:'Women',brand:'Roadster',name:'Solid Schiffli Regular Top',price:'₹799',img:'https://assets.myntassets.com/assets/images/22376552/2023/3/24/532b28ae-f460-47c4-ab26-83cf9b453be81679638608678-Roadster-Women-Tops-4181679638608119-1.jpg',conf:80},
{id:6,cat:'Women',brand:'Anouk',name:'Printed Pure Cotton A-Line Midi Dress',price:'₹1,499',img:'https://assets.myntassets.com/assets/images/2025/JULY/7/luktB1kB_2052cbfc2d8f4f5f96bb37ad125cff16.jpg',conf:87},
{id:7,cat:'Kids',brand:'U.S. Polo Assn.',name:'Boys Navy Blue Cotton T-Shirt',price:'₹699',img:'https://cdn.fcglcdn.com/brainbees/images/products/zoom/us-polo-assn-cotton-knit-half-sleeves-t-shirt-with-brand-text-embroidery-navy-blue-22190224zzsq.jpg',conf:83},
{id:8,cat:'Kids',brand:'H&M',name:'Boys Light Blue Cotton Shirt',price:'₹999',img:'https://assets.myntassets.com/h_200,w_200,c_fill,g_auto/h_1440,q_75,w_1080/v1/assets/images/30154258/2024/7/8/d20450c0-5072-4d8c-b296-fc195a1ae8f21720453317820Long-sleevedcottonshirt1.jpg',conf:81},
{id:9,cat:'Kids',brand:'H&M',name:'Boys Linen-Blend Shorts',price:'₹899',img:'https://assets.myntassets.com/h_200,w_200,c_fill,g_auto/h_1440,q_100,w_1080/v1/assets/images/2025/MARCH/20/U7ZS0964_660c7430e9394d128836dd874e60078c.jpg',conf:85},
{id:10,cat:'Home',brand:'EverHome',name:'White Floral Cotton Bedsheet Set',price:'₹1,299',img:'https://everhomestores.com/cdn/shop/products/EHSKB20020_1.jpg?v=1676614080',conf:79},
{id:11,cat:'Home',brand:'HOME 360',name:'Beige Quad Cushion Covers',price:'₹599',img:'https://images-static.nykaa.com/media/catalog/product/7/0/701bf5aHOME360-09-Beige_3.jpg',conf:76},
{id:12,cat:'Home',brand:'Nilkamal',name:'Metalia Gold Table Lamp',price:'₹1,999',img:'https://www.nilkamalhomes.com/cdn/shop/files/HTL18IMSTMLT00710.jpg?v=1700565209&width=1214',conf:82},
{id:13,cat:'Beauty',brand:'Maybelline New York',name:'SuperStay Matte Ink Liquid Lipstick',price:'₹699',img:'https://cdn.fcglcdn.com/brainbees/images/products/zoom/maybelline-new-york-matte-liquid-lipstick-220-ambitious-5ml-10670735zzsq.jpg',conf:90},
{id:14,cat:'Beauty',brand:'Minimalist',name:'2% Salicylic Acid + LHA Face Cleanser',price:'₹299',img:'https://images.apollo247.in/pub/media/catalog/product/M/I/MIN0776_1.jpg?tr=w-400,q-80,f-webp,c-at_max',conf:91},
{id:15,cat:'Beauty',brand:'Plum',name:'Rice Water & Niacinamide Toner',price:'₹425',img:'https://images-static.nykaa.com/media/catalog/product/4/6/460ebf28904430208680_15.jpg?tr=w-500',conf:88}
];
const saved=[1,2,4,6,8,13];
function home(){app.innerHTML=`<section class="hero"><h1>Fashion that fits your life.</h1><div class="muted">Explore categories, discover products and make more confident purchase decisions.</div><div class="cats">${['Men','Women','Kids','Home','Beauty'].map(x=>`<button class="cat" onclick="category('${x}')">${x}</button>`).join('')}</div></section><h2 class="section-title">Trending picks</h2><div class="grid">${products.slice(0,6).map(card).join('')}</div>`}
function category(c){app.innerHTML=`<button class="back" onclick="home()">← Home</button><section class="hero"><h1>${c}</h1><div class="muted">Shop ${c.toLowerCase()} categories</div><div class="cats">${({Men:['Topwear','Bottomwear','Footwear','Sports & Active Wear','Accessories'],Women:['Indian & Fusion Wear','Western Wear','Footwear','Sports & Active Wear','Jewellery'],Kids:['Boys Clothing','Girls Clothing','Footwear','Toys & Games','Kids Accessories'],Home:['Bed Linen & Furnishing','Bath','Home Décor','Cushions','Lamps & Lighting'],Beauty:['Makeup','Skincare','Haircare','Fragrances','Men’s Grooming']}[c]).map(x=>`<button class="cat">${x}</button>`).join('')}</div></section><div class="grid">${products.filter(p=>p.cat===c).map(card).join('')}</div>`}
function card(p){return `<article class="card" onclick="detail(${p.id})"><div class="pic"><img src="${p.img}" alt="${p.name}"><button class="heart" onclick="event.stopPropagation();toggleSave(${p.id})">${saved.includes(p.id)?'♥':'♡'}</button></div><div class="details"><div class="brand">${p.brand}</div><div class="name">${p.name}</div><div class="price">${p.price}</div><span class="tag">${p.conf}% purchase confidence</span></div></article>`}
function detail(id){let p=products.find(x=>x.id===id);app.innerHTML=`<button class="back" onclick="${saved.includes(id)?'wishlist()':`category('${p.cat}')`}">← Back</button><div class="product"><div class="bigpic"><img src="${p.img}" alt="${p.name}"></div><div class="info"><div class="brand">${p.brand}</div><h1>${p.name}</h1><div class="price">${p.price}</div><div class="muted">Myntra product experience · Confidence Check MVP</div><div class="confidence"><div class="score"><div><div class="muted">YOUR PURCHASE CONFIDENCE</div><b id="score">${p.conf}%</b></div><strong id="level">● High</strong></div><div class="meter"><i id="meter" style="width:${p.conf}%"></i></div><div class="chips"><span class="chip">✓ Fit evidence</span><span class="chip">✓ Buyer photos</span><span class="chip">✓ Material signals</span></div><p class="muted">A decision aid based on product-reality evidence. Not a guarantee.</p></div><div class="evidence"><h3>Will it fit me?</h3><div class="fit"><button onclick="choose(this,4,${p.conf})">My usual size</button><button onclick="choose(this,8,${p.conf})">I usually size up</button><button onclick="choose(this,2,${p.conf})">I usually size down</button><button onclick="choose(this,6,${p.conf})">I'm unsure</button></div><h3 style="margin-top:22px">Why this confidence score?</h3><div class="ev"><b>Fit</b><br>Fit-related evidence is summarized so you don't need to scan dozens of reviews.</div><div class="ev"><b>Real-world appearance</b><br>Buyer photos provide context beyond studio photography.</div><div class="ev"><b>Quality</b><br>Feedback is summarized around fabric, finish and perceived quality.</div></div><button class="cta" onclick="addBag(${p.id})">Add to Bag — confident choice</button><button class="cta secondary" onclick="alert('Evidence view: fit, buyer-photo and quality signals are surfaced here in the MVP.')">See evidence before buying</button><p class="muted" style="font-size:12px">No discount or monetary incentive is used. The product hypothesis is to reduce uncertainty at Wishlist re-evaluation.</p></div></div>`}
function choose(el,d,base){document.querySelectorAll('.fit button').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');let s=Math.max(65,Math.min(96,base+d-4));score.textContent=s+'%';meter.style.width=s+'%'}
function wishlist(){app.innerHTML=`<section class="hero"><h1>My Wishlist</h1><div class="muted">Saved styles for later · Select an item to open Confidence Check.</div></section><div class="grid">${products.filter(p=>saved.includes(p.id)).map(card).join('')}</div>`}
function toggleSave(id){let i=saved.indexOf(id);if(i>=0)saved.splice(i,1);else saved.push(id);home()}
let bagItems=[];function addBag(id){if(!bagItems.includes(id))bagItems.push(id);alert('Added to Bag.');bag()}
function bag(){app.innerHTML=`<section class="bag"><h1>Bag</h1>${bagItems.length?`<div class="grid">${products.filter(p=>bagItems.includes(p.id)).map(card).join('')}</div><button class="cta" onclick="alert('MVP checkout: in production this would connect to Myntra checkout.')">Proceed to Checkout</button>`:`<div class="empty"><h2>Your bag is empty</h2><p class="muted">Add a product from Wishlist or any category.</p><button class="cta" onclick="home()">Continue Shopping</button></div>`}</section>`}
function doSearch(){let q=search.value.toLowerCase().trim();let r=products.filter(p=>(p.name+' '+p.brand+' '+p.cat).toLowerCase().includes(q));app.innerHTML=`<button class="back" onclick="home()">← Home</button><h1>Search results</h1><p class="muted">${r.length} products found for “${q}”</p><div class="grid">${r.length?r.map(card).join(''):'<div class="empty"><h2>No products found</h2></div>'}</div>`}
home();
</script></body></html>
